name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Build Project
        run: |
          echo "Building project..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Build successful!"

      - name: Run Tests
        run: |
          echo "Running tests..."
          test -s index.html
          echo "Tests passed!"

      - name: Generate Build Log
        run: |
          echo "CI Pipeline completed successfully."
          echo "Build timestamp:"
          date